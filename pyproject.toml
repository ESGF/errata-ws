[project]
name = "errata-ws"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arrow>=1.4.0",
    "b2handle>=1.1.2",
    "bs4>=0.0.2",
    "esgfpid>=0.8.2",
    "esgvoc>=2.2.0",
    "github3-py>=4.0.1",
    "jsonschema>=4.26.0",
    "nose>=1.3.7",
    "psycopg2-binary>=2.9.11",
    "requests>=2.32.5",
    "requests-oauthlib>=2.0.0",
    "schedule>=1.2.2",
    "sqlalchemy>=2.0.46",
    "sqlalchemy-utils>=0.42.1",
    "supervisor>=4.3.0",
    "tornado>=6.5.4",
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "errata_ws"
module-root = ""

[dependency-groups]
dev = [
    "rich>=14.3.1",
]
