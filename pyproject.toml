[project]
name = "errata-ws"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arrow>=1.2.0",
    "beautifulsoup4>=4.12.0",
    "b2handle>=1.0.0",
    "certifi>=2017.4.17",
    "charset-normalizer>=2.0.0",
    "idna>=2.5",
    "jsonschema>=4.0.0",
    "oauthlib>=3.2.0",
    "python-dateutil>=2.8.0",
    "psycopg2-binary>=2.9.6",
    "requests>=2.28.0",
    "requests-oauthlib>=1.3.0",
    "schedule>=1.1.0",
    "six>=1.16.0",
    "SQLAlchemy>=2.0.0",
    "SQLAlchemy-Utils>=0.40.0",
    "tornado>=6.2.0",
    "typing_extensions>=4.0.0",
    "PyGithub>=1.55.0",
    "pytest>=7.0.0",
    "esgfpid",
    "urllib3>=2.0.0",
]
[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "errata_ws"
module-root = ""

[dependency-groups]
dev = [
    "jupyter-console>=6.6.3",
    "rich>=14.3.1",
]
